<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Real Time Object Detection</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
text-align:center;
font-family:Arial;
background:#eef2f7;
}

h1{
color:#222;
}

#container{
position:relative;
display:inline-block;
}

video{
border:4px solid black;
border-radius:10px;
}

canvas{
position:absolute;
left:0;
top:0;
}
</style>
</head>

<body>

<h1>Webcam Object Detection</h1>

<div id="container">
<video id="webcam" width="640" height="480" autoplay muted></video>
<canvas id="canvas" width="640" height="480"></canvas>
</div>

<h3 id="status">Loading Model...</h3>

<script>

const video = document.getElementById("webcam");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let model;

async function startWebcam(){

const stream = await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject = stream;

return new Promise(resolve=>{
video.onloadedmetadata = ()=>{
resolve(video);
}
});
}

async function loadModel(){

model = await cocoSsd.load();

statusText.innerText = "Model Loaded - Detecting Objects...";

detectFrame();
}

async function detectFrame(){

const predictions = await model.detect(video);

ctx.clearRect(0,0,canvas.width,canvas.height);

predictions.forEach(pred => {

if(pred.score > 0.60){   // confidence filter

const [x,y,width,height] = pred.bbox;

ctx.strokeStyle="red";
ctx.lineWidth=3;
ctx.strokeRect(x,y,width,height);

ctx.fillStyle="red";
ctx.font="18px Arial";

ctx.fillText(
pred.class + " " + (pred.score*100).toFixed(1)+"%",
x,
y>20 ? y-5 : 20
);

}

});

setTimeout(detectFrame,200);

}

async function main(){

await startWebcam();
video.play();
loadModel();

}

main();

</script>

</body>
</html>
