<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pose Detection with PoseNet</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

<style>
body{
font-family: Arial;
text-align:center;
background:#eef2f7;
}

#container{
position:relative;
display:inline-block;
}

video{
border:3px solid black;
border-radius:10px;
}

canvas{
position:absolute;
left:0;
top:0;
}
</style>
</head>

<body>

<h2>Human Pose Detection (PoseNet)</h2>

<div id="container">
<video id="video" width="640" height="480" autoplay muted></video>
<canvas id="canvas" width="640" height="480"></canvas>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let model;

async function setupCamera(){

const stream = await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject = stream;

return new Promise(resolve=>{
video.onloadedmetadata = ()=>resolve(video);
});

}

async function loadModel(){

model = await posenet.load();

detectPose();

}

function drawKeypoints(keypoints){

keypoints.forEach(point => {

if(point.score > 0.5){

const x = point.position.x;
const y = point.position.y;

ctx.beginPath();
ctx.arc(x,y,5,0,2*Math.PI);
ctx.fillStyle="red";
ctx.fill();

}

});

}

function drawSkeleton(keypoints){

const pairs = posenet.getAdjacentKeyPoints(keypoints,0.5);

pairs.forEach(pair => {

ctx.beginPath();
ctx.moveTo(pair[0].position.x, pair[0].position.y);
ctx.lineTo(pair[1].position.x, pair[1].position.y);
ctx.strokeStyle="green";
ctx.lineWidth=2;
ctx.stroke();

});

}

async function detectPose(){

const pose = await model.estimateSinglePose(video);

ctx.clearRect(0,0,canvas.width,canvas.height);

drawKeypoints(pose.keypoints);
drawSkeleton(pose.keypoints);

requestAnimationFrame(detectPose);

}

async function main(){

await setupCamera();
video.play();
loadModel();

}

main();

</script>

</body>
</html>
