<!DOCTYPE html>
<html>
<head>

<title>MobileNet Image Classification Accuracy Test</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.container{
width:750px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

img{
margin-top:15px;
border-radius:8px;
}

button{
padding:10px 20px;
background:#2ecc71;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

table{
margin:auto;
margin-top:20px;
border-collapse:collapse;
}

td,th{
border:1px solid gray;
padding:8px;
}

</style>

</head>

<body>

<div class="container">

<h2>MobileNet Image Classification</h2>

<h4 id="status">Loading Model...</h4>

<p>Select Image and Enter Actual Label</p>

<input type="file" id="upload">
<br><br>

<input type="text" id="actualLabel" placeholder="Enter actual object (dog, cat, car etc)">

<br><br>

<img id="image" width="300">

<br><br>

<button onclick="classifyImage()">Classify Image</button>

<h3>Results</h3>

<table id="table">
<tr>
<th>Image No</th>
<th>Actual</th>
<th>Predicted</th>
<th>Confidence</th>
<th>Status</th>
</tr>
</table>

<h3 id="accuracy"></h3>

</div>

<script>

let model;
let total=0;
let correct=0;

async function loadModel(){

model = await mobilenet.load();

document.getElementById("status").innerHTML="Model Loaded Successfully";

}

loadModel();

async function classifyImage(){

const file=document.getElementById("upload").files[0];

if(!file){
alert("Upload image first");
return;
}

const actual=document.getElementById("actualLabel").value.toLowerCase();

const img=document.getElementById("image");

img.src=URL.createObjectURL(file);

await new Promise(resolve=>img.onload=resolve);

const predictions=await model.classify(img);

const predicted=predictions[0].className.toLowerCase();

const confidence=(predictions[0].probability*100).toFixed(2)+"%";

total++;

let status="Incorrect";

if(predicted.includes(actual)){
correct++;
status="Correct";
}

const table=document.getElementById("table");

const row=table.insertRow();

row.insertCell(0).innerHTML=total;
row.insertCell(1).innerHTML=actual;
row.insertCell(2).innerHTML=predicted;
row.insertCell(3).innerHTML=confidence;
row.insertCell(4).innerHTML=status;

let acc=((correct/total)*100).toFixed(2);

document.getElementById("accuracy").innerHTML="Accuracy : "+acc+" %";

}

</script>

</body>
</html>
