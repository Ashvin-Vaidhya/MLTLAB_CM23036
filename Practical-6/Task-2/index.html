<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Squat Counter with PoseNet</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#eef2f7;
}

#container{
position:relative;
display:inline-block;
}

video{
border:3px solid black;
}

canvas{
position:absolute;
left:0;
top:0;
}

#info{
font-size:24px;
margin-top:10px;
font-weight:bold;
}
</style>
</head>

<body>

<h2>Squat Repetition Counter (PoseNet)</h2>

<div id="container">
<video id="video" width="640" height="480" autoplay muted></video>
<canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="info">
Squats: <span id="count">0</span>
<br>
Knee Angle: <span id="angle">0</span>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const countText = document.getElementById("count");
const angleText = document.getElementById("angle");

let model;
let squatCount = 0;
let stage = "up";

async function setupCamera(){

const stream = await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject = stream;

return new Promise(resolve=>{
video.onloadedmetadata = ()=>resolve(video);
});

}

async function loadModel(){

model = await posenet.load();

detect();

}

function calculateAngle(A,B,C){

const AB = {x:A.x-B.x,y:A.y-B.y};
const CB = {x:C.x-B.x,y:C.y-B.y};

const dot = AB.x*CB.x + AB.y*CB.y;
const magAB = Math.sqrt(AB.x*AB.x + AB.y*AB.y);
const magCB = Math.sqrt(CB.x*CB.x + CB.y*CB.y);

const angle = Math.acos(dot/(magAB*magCB));

return angle*180/Math.PI;

}

async function detect(){

const pose = await model.estimateSinglePose(video);

ctx.clearRect(0,0,canvas.width,canvas.height);

pose.keypoints.forEach(p=>{
if(p.score>0.5){
ctx.beginPath();
ctx.arc(p.position.x,p.position.y,5,0,2*Math.PI);
ctx.fillStyle="red";
ctx.fill();
}
});

const hip = pose.keypoints.find(k=>k.part==="leftHip");
const knee = pose.keypoints.find(k=>k.part==="leftKnee");
const ankle = pose.keypoints.find(k=>k.part==="leftAnkle");

if(hip.score>0.5 && knee.score>0.5 && ankle.score>0.5){

const angle = calculateAngle(
hip.position,
knee.position,
ankle.position
);

angleText.innerHTML = angle.toFixed(1);

if(angle < 90){
stage = "down";
}

if(angle > 160 && stage==="down"){
stage="up";
squatCount++;
countText.innerHTML = squatCount;
}

}

requestAnimationFrame(detect);

}

async function main(){

await setupCamera();
video.play();
loadModel();

}

main();

</script>

</body>
</html>
