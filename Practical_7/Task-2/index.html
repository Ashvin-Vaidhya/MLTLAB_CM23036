<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Model Verification</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>
body {
    font-family: Arial;
    background: #0f2027;
    color: white;
    text-align: center;
    padding: 40px;
}

.container {
    background: #203a43;
    padding: 25px;
    border-radius: 12px;
    width: 450px;
    margin: auto;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.train { background: #28a745; }
.verify { background: #17a2b8; }

.result-box {
    background: #2c5364;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔁 Model Reload Verification</h2>

    <button class="train" onclick="trainModel()">Train & Save</button>
    <button class="verify" onclick="verifyModel()">Verify</button>

    <div class="result-box" id="output">
        Results will appear here...
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
