<!DOCTYPE html>
<html>
<head>
    <title>Export & Import Model</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #1c1c1c;
            color: white;
            padding: 40px;
        }

        .box {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            width: 450px;
            margin: auto;
        }

        button {
            padding: 10px 15px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .train { background: green; }
        .export { background: orange; }
        .import { background: blue; }
        .verify { background: purple; }

        #output {
            margin-top: 20px;
            text-align: left;
            background: #444;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>📦 Export & Import Model</h2>

    <button class="train" onclick="trainModel()">Train</button>
    <button class="export" onclick="exportModel()">Export</button>

    <br>

    <input type="file" id="fileInput" multiple>
    <button class="import" onclick="importModel()">Import</button>

    <br>

    <button class="verify" onclick="verifyModel()">Verify</button>

    <div id="output">Results will appear here...</div>
</div>

<script src="script.js"></script>
</body>
</html>
