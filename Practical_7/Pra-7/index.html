<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Model Deployment</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.17.0/tf.min.js"></script>

<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118; /* FIXED */
  --border: #1e1e2e;
  --accent: #00ffc8;
  --accent2: #ff6b6b;
  --accent3: #6b8cff;
  --text: #e0e0f0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Card */
.container {
  background: var(--surface);
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  width: 350px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

h1 { margin-bottom: 10px; }

input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

.train { background: #6b8cff; color: white; }
.save { background: #00ffc8; }
.load { background: orange; }
.predict { background: #00c9a7; }

#result {
  margin-top: 15px;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ML App</h1>
<p>Model: y = 2x + 1</p>

<button class="train" onclick="trainModel()">Train</button>
<button class="save" onclick="saveModel()">Save</button>
<button class="load" onclick="loadModel()">Load</button>

<input type="number" id="x" placeholder="Enter X">

<button class="predict" onclick="predict()">Predict</button>

<div id="result">Waiting...</div>

</div>

<script>
let model = null;
const MODEL_KEY = 'indexeddb://my-model';

// TRAIN MODEL
async function trainModel() {
  const xs = tf.tensor2d([-1,0,1,2,3,4],[6,1]);
  const ys = tf.tensor2d([-1,1,3,5,7,9],[6,1]);

  model = tf.sequential();
  model.add(tf.layers.dense({units:1, inputShape:[1]}));
  model.compile({optimizer:'sgd', loss:'meanSquaredError'});

  document.getElementById("result").innerText = "Training...";

  await model.fit(xs, ys, {epochs:200});

  document.getElementById("result").innerText = "✅ Training Done";
}

// SAVE MODEL
async function saveModel() {
  if (!model) {
    alert("Train model first!");
    return;
  }
  await model.save(MODEL_KEY);
  document.getElementById("result").innerText = "💾 Model Saved";
}

// LOAD MODEL
async function loadModel() {
  try {
    model = await tf.loadLayersModel(MODEL_KEY);
    document.getElementById("result").innerText = "📂 Model Loaded";
  } catch {
    document.getElementById("result").innerText = "❌ No saved model";
  }
}

// PREDICT
async function predict() {
  if (!model) {
    alert("Load or Train model first!");
    return;
  }

  let x = document.getElementById("x").value;

  if (x === "") {
    document.getElementById("result").innerText = "Enter value!";
    return;
  }

  let input = tf.tensor2d([parseFloat(x)], [1,1]);
  let output = model.predict(input);
  let result = output.dataSync()[0];

  document.getElementById("result").innerText =
    "Prediction: " + result.toFixed(2);

  input.dispose();
  output.dispose();
}

// AUTO LOAD MODEL
window.onload = async () => {
  try {
    model = await tf.loadLayersModel(MODEL_KEY);
    document.getElementById("result").innerText = "✅ Auto Loaded Model";
  } catch {
    document.getElementById("result").innerText = "Train model first";
  }
};
</script>

</body>
</html>
